:root{
  --bg:#ffffff;
  --ink:#1c1c1c;
  --muted:#6f6f6f;
  --line:#d9d9d9;
  --soft:#f3f3f3;
  --blue:#1f6fe5;
  --blue-soft:#e9f1fd;
  --green:#1a8f4c;
  --green-soft:#e7f6ec;
  --red:#d83a3a;
  --red-soft:#fdecec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Nunito', system-ui, sans-serif;
  font-size:clamp(17px, 4.6vw, 24px);
  line-height:1.5;font-weight:400;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 80px;}

header{text-align:center;padding:24px 10px 14px;border-bottom:2px solid var(--line);}
.badge{display:inline-block;font-size:.5em;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:5px 16px;margin-bottom:12px;}
header h1{margin:0;font-size:1.04em;font-weight:700;line-height:1.28;}
header .sub{margin:6px 0 0;font-size:.62em;color:var(--muted);font-weight:700;letter-spacing:.04em;}
header .instruct{margin:12px auto 0;font-size:.6em;font-weight:700;color:var(--blue);
  border:2px solid var(--blue-soft);background:var(--blue-soft);border-radius:999px;padding:6px 16px;display:inline-block;}

.progress{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 4px;border-bottom:2px solid var(--line);margin-bottom:22px;}
.progress .count{display:flex;justify-content:space-between;align-items:baseline;font-size:.58em;font-weight:700;color:var(--muted);margin-bottom:9px;}
.progress .count b{color:var(--blue);}
.dots{display:flex;flex-wrap:wrap;gap:6px;}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;transition:.15s;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;line-height:1;}
.dot.answered{background:var(--blue);border-color:var(--blue);}
.dot.res-correct{background:var(--green);border-color:var(--green);}
.dot.res-correct::after{content:"\2713";}
.dot.res-wrong{background:var(--red);border-color:var(--red);}
.dot.res-wrong::after{content:"\2715";}

.legend{display:none;gap:18px;justify-content:center;margin-top:12px;font-size:.55em;font-weight:700;flex-wrap:wrap;}
.legend.show{display:flex;}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.legend i{width:15px;height:15px;border-radius:50%;display:inline-block;}
.legend .g{background:var(--green);}
.legend .r{background:var(--red);}

.pagetag{font-size:.62em;font-weight:700;color:var(--muted);margin:0 0 16px;letter-spacing:.04em;}

.q{border:2px solid var(--line);border-radius:20px;padding:18px 18px 8px;margin-bottom:18px;}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.q-no{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72em;}
.q-text{font-weight:700;line-height:1.35;padding-top:.1em;}
.q-cat{display:inline-block;font-size:.62em;font-weight:700;color:var(--blue);
  border:2px solid var(--blue-soft);background:var(--blue-soft);border-radius:999px;padding:1px 11px;margin-left:8px;vertical-align:middle;letter-spacing:.03em;}

.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;margin:9px 0;
  border:2px solid var(--line);border-radius:16px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--blue);}
.opt.picked:not(.locked){border-color:var(--blue);background:var(--blue-soft);}
.opt input{margin:.28em 0 0;width:1em;height:1em;accent-color:var(--blue);flex:none;}
.opt .lab{font-weight:700;flex:none;min-width:1.2em;}
.opt-text{flex:1;}
.opt.locked{cursor:default;}
.opt.locked:hover{border-color:var(--line);}
.opt.correct{background:var(--green-soft);border-color:var(--green);}
.opt.correct .lab{color:var(--green);}
.opt.wrong{background:var(--red-soft);border-color:var(--red);}
.opt.wrong .opt-text{text-decoration:line-through;}
.opt.wrong .lab{color:var(--red);}
.tag{display:block;font-size:.62em;font-weight:700;margin-top:6px;}
.tag.ok{color:var(--green);}
.tag.no{color:var(--red);}

.nav{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
button{font-family:'Nunito',sans-serif;font-size:.84em;font-weight:700;cursor:pointer;border-radius:999px;
  padding:14px 26px;transition:.12s;border:2px solid var(--blue);flex:1;min-width:140px;}
.btn-main{background:var(--blue);color:#fff;}
.btn-main:active{transform:translateY(1px);}
.btn-ghost{background:var(--bg);color:var(--blue);}
.btn-ghost:hover{background:var(--blue-soft);}

.result{border:2px solid var(--blue);border-radius:22px;padding:22px;margin-bottom:24px;text-align:center;}
.result h2{margin:0 0 4px;font-size:.66em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.result .score{font-size:2.1em;font-weight:700;line-height:1;color:var(--blue);}
.result .score small{font-size:.4em;color:var(--muted);font-weight:700;}
.result .meta{margin-top:12px;font-size:.62em;font-weight:700;display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
.result .meta b{color:var(--blue);}
.result .warn{margin-top:12px;font-size:.56em;font-weight:700;color:var(--red);border-top:2px solid var(--line);padding-top:12px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">Mock Exam 1</span>
    <h1>Ôn tập cuối kỳ học phần Tin học và trí tuệ nhân tạo ứng dụng</h1>
    <p class="sub">Học phần ITE1292 · Lớp B16 &amp; B17 (Ms. Thạch Thảo)</p>
    <p class="sub">40 câu</p>
    <p class="instruct">Chọn đáp án đúng nhất cho mỗi câu hỏi.</p>
  </header>

  <div class="progress">
    <div class="count"><span>Tiến độ</span><span><b id="doneCount">0</b>/40 câu</span></div>
    <div class="dots" id="dots"></div>
    <div class="legend" id="legend">
      <span><i class="g"></i> Đúng</span>
      <span><i class="r"></i> Sai / chưa làm</span>
    </div>
  </div>

  <div class="result hidden" id="result">
    <h2>Kết quả</h2>
    <div class="score"><span id="scoreCount">0</span><small>/40 đúng</small></div>
    <div class="meta">
      <span>Tỉ lệ: <b id="scorePct">0%</b></span>
      <span>Điểm hệ 10: <b id="score10">0.0</b></span>
    </div>
    <div class="warn hidden" id="warnUnanswered"></div>
  </div>

  <p class="pagetag" id="pagetag">Trang 1 / 2 · Câu 1–20</p>
  <div id="page1"></div>
  <div id="page2" class="hidden"></div>

  <div class="nav" id="nav1"><button class="btn-main" onclick="goPage(2)">Trang tiếp theo →</button></div>
  <div class="nav hidden" id="nav2">
    <button class="btn-ghost" onclick="goPage(1)">← Quay lại</button>
    <button class="btn-main" onclick="submitQuiz()">Nộp bài</button>
  </div>
  <div class="nav hidden" id="navResult"><button class="btn-ghost" onclick="retryQuiz()">Làm lại</button></div>
</div>

<script>
const QUESTIONS = [{"cat": "CNTT", "q": "Khái niệm nào mô tả đúng nhất về Công nghệ thông tin (CNTT)?", "o": ["Ngành chế tạo linh kiện điện tử", "Ngành ứng dụng máy tính để xử lý, lưu trữ và truyền thông tin", "Mạng Internet toàn cầu", "Kỹ thuật sửa chữa máy tính"], "correct": 1}, {"cat": "CNTT", "q": "Thiết bị nào thuộc nhóm thiết bị nhập?", "o": ["Máy in", "Loa", "Máy quét mã vạch", "Màn hình"], "correct": 2}, {"cat": "CNTT", "q": "Đặc điểm đúng của RAM là", "o": ["Lưu dữ liệu vĩnh viễn", "Là bộ nhớ chỉ đọc", "Mất dữ liệu khi tắt nguồn", "Lưu BIOS"], "correct": 2}, {"cat": "CNTT", "q": "Hệ điều hành nào là mã nguồn mở?", "o": ["Windows", "macOS", "Ubuntu Linux", "iOS"], "correct": 2}, {"cat": "CNTT", "q": "Tổ hợp phím mở File Explorer là", "o": ["Ctrl+E", "Windows+E", "Alt+E", "Windows+F"], "correct": 1}, {"cat": "CNTT", "q": "Thiết bị định tuyến gói tin giữa các mạng là", "o": ["Hub", "Switch", "Router", "Repeater"], "correct": 2}, {"cat": "CNTT", "q": "Phishing nhằm mục đích", "o": ["Tăng tốc mạng", "Đánh cắp thông tin", "Mã hóa ổ cứng", "Xóa dữ liệu"], "correct": 1}, {"cat": "Word", "q": "Ctrl+J trong Word dùng để", "o": ["Canh trái", "Canh phải", "Canh đều hai lề", "Canh giữa"], "correct": 2}, {"cat": "Word", "q": "Drop Cap dùng để", "o": ["Tạo chữ cái đầu đoạn lớn", "Chèn WordArt", "Đánh số trang", "Chia cột"], "correct": 0}, {"cat": "Word", "q": "Format Painter có chức năng", "o": ["Sao chép nội dung", "Sao chép định dạng", "Xóa định dạng", "Đổi font"], "correct": 1}, {"cat": "Word", "q": "Muốn chèn bảng dùng", "o": ["Insert→Table", "Home→Table", "Review→Table", "Design→Table"], "correct": 0}, {"cat": "Word", "q": "Phím tắt Replace là", "o": ["Ctrl+F", "Ctrl+H", "Ctrl+R", "F5"], "correct": 1}, {"cat": "Word", "q": "Line Spacing dùng để", "o": ["Đổi font", "Khoảng cách dòng", "Khoảng cách ký tự", "Canh lề"], "correct": 1}, {"cat": "Word", "q": "Page Border dùng để", "o": ["Khung đoạn", "Khung toàn trang", "Khung bảng", "Đổi nền"], "correct": 1}, {"cat": "Word", "q": "Ctrl+Enter trong Word", "o": ["Xuống dòng", "Ngắt trang", "Đóng file", "Lưu"], "correct": 1}, {"cat": "Word", "q": "Leader trong Tabs dùng để", "o": ["Canh lề", "Tạo dấu chấm dẫn", "Đổi tab", "Đánh số"], "correct": 1}, {"cat": "Word", "q": "Export→Create PDF/XPS dùng để", "o": ["Nén file", "Xuất PDF/XPS", "Chia sẻ", "In"], "correct": 1}, {"cat": "Excel", "q": "Hàm SUMIF dùng để", "o": ["Đếm có điều kiện", "Tính tổng có điều kiện", "Tính trung bình", "Xếp hạng"], "correct": 1}, {"cat": "Excel", "q": "=ROUND(125.534,1) cho kết quả", "o": ["125.5", "125.6", "125.53", "126"], "correct": 0}, {"cat": "Excel", "q": "Lỗi #DIV/0! xảy ra khi", "o": ["Sai tên hàm", "Chia cho 0", "Sai tham chiếu", "Ô quá hẹp"], "correct": 1}, {"cat": "Excel", "q": "Phím F4 trong Excel dùng để", "o": ["Đổi kiểu địa chỉ ô", "Chỉnh sửa ô", "Lưu", "Đổi sheet"], "correct": 0}, {"cat": "Excel", "q": "COUNTA khác COUNT ở điểm", "o": ["Đếm ô không rỗng", "Đếm ô số", "Đếm ô lỗi", "Đếm ô trống"], "correct": 0}, {"cat": "Excel", "q": "VLOOKUP(...,FALSE) nghĩa là", "o": ["Dò gần đúng", "Dò chính xác", "Dò từ cuối", "Bỏ qua lỗi"], "correct": 1}, {"cat": "Excel", "q": "Hàm LEFT dùng để", "o": ["Lấy ký tự bên phải", "Lấy ký tự bên trái", "Lấy giữa", "Đếm ký tự"], "correct": 1}, {"cat": "Excel", "q": "Freeze Top Row dùng để", "o": ["Khóa hàng đầu", "Khóa cột đầu", "Khóa vùng chọn", "Ẩn hàng"], "correct": 0}, {"cat": "Excel", "q": "=AND(5>3,4<2) trả về", "o": ["TRUE", "FALSE", "0", "Lỗi"], "correct": 1}, {"cat": "Excel", "q": "Biểu đồ Pie phù hợp để", "o": ["So sánh xu hướng", "Thể hiện tỷ trọng", "Phân tán", "Dự báo"], "correct": 1}, {"cat": "Excel", "q": "Merge & Center dùng để", "o": ["Gộp ô và căn giữa", "Tách ô", "Đổi màu", "Định dạng số"], "correct": 0}, {"cat": "PowerPoint", "q": "F5 trong PowerPoint dùng để", "o": ["Trình chiếu từ đầu", "Slide mới", "Lưu", "In"], "correct": 0}, {"cat": "PowerPoint", "q": "Shift+F5 dùng để", "o": ["Trình chiếu từ đầu", "Trình chiếu từ slide hiện tại", "Thoát", "Ẩn slide"], "correct": 1}, {"cat": "PowerPoint", "q": "Transitions dùng để", "o": ["Hiệu ứng đối tượng", "Hiệu ứng chuyển slide", "Đổi font", "Đổi nền"], "correct": 1}, {"cat": "PowerPoint", "q": "Slide Master dùng để", "o": ["Định dạng toàn bài", "Xuất video", "In", "Chèn âm thanh"], "correct": 0}, {"cat": "PowerPoint", "q": "Animation Painter dùng để", "o": ["Sao chép hiệu ứng", "Sao chép slide", "Sao chép nền", "Sao chép chữ"], "correct": 0}, {"cat": "PowerPoint", "q": "Present Online dùng để", "o": ["Trình chiếu trực tuyến", "Xuất PDF", "Ghi âm", "Nén file"], "correct": 0}, {"cat": "AI", "q": "AI là viết tắt của", "o": ["Automated Intelligence", "Artificial Intelligence", "Artificial Integration", "Advanced Intelligence"], "correct": 1}, {"cat": "AI", "q": "Machine Learning là", "o": ["Máy học từ dữ liệu", "Robot thông minh", "Internet vạn vật", "Điện toán đám mây"], "correct": 0}, {"cat": "AI", "q": "Prompt là", "o": ["Thuật toán AI", "Câu lệnh dành cho AI", "Mô hình AI", "Bộ dữ liệu"], "correct": 1}, {"cat": "AI", "q": "NotebookLM hỗ trợ", "o": ["Tóm tắt và hỏi đáp trên tài liệu", "Thiết kế logo", "Lập trình", "Chỉnh video"], "correct": 0}, {"cat": "AI", "q": "Khi AI đưa ra Hallucination, người dùng nên", "o": ["Tin hoàn toàn", "Kiểm chứng bằng nguồn đáng tin cậy", "Bỏ qua mọi kết quả AI", "Tắt Internet"], "correct": 1}, {"cat": "AI", "q": "Để AI đưa ra câu trả lời chính xác và phù hợp hơn, người dùng nên", "o": ["Viết prompt càng ngắn càng tốt", "Cung cấp ngữ cảnh và yêu cầu cụ thể, rõ ràng trong prompt", "Dùng thật nhiều dấu chấm than", "Viết prompt bằng chữ IN HOA"], "correct": 1}];
const LETTERS = ["A","B","C","D"];
let submitted = false;

function optHTML(item,i){
  const opts = item.o.map((t,j)=>`
    <label class="opt" data-q="${i}" data-opt="${j}">
      <input type="radio" name="q${i}" value="${j}" onchange="onAnswer(${i})">
      <span class="lab">${LETTERS[j]}.</span>
      <span class="opt-text">${t}</span>
    </label>`).join("");
  return `<div class="q" id="q${i}"><div class="q-head">
      <div class="q-no">${i+1}</div>
      <div class="q-text">${item.q}<span class="q-cat">${item.cat}</span></div>
    </div>${opts}</div>`;
}
function render(){
  document.getElementById("page1").innerHTML = QUESTIONS.slice(0,20).map((it,idx)=>optHTML(it,idx)).join("");
  document.getElementById("page2").innerHTML = QUESTIONS.slice(20).map((it,idx)=>optHTML(it,idx+20)).join("");
  document.getElementById("dots").innerHTML = QUESTIONS.map((_,i)=>`<div class="dot" id="dot${i}" title="Câu ${i+1}"></div>`).join("");
  updateCount();
}
function onAnswer(i){
  document.getElementById("dot"+i).classList.add("answered");
  document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(l=>l.classList.remove("picked"));
  const sel=document.querySelector(`input[name="q${i}"]:checked`);
  if(sel) sel.closest(".opt").classList.add("picked");
  updateCount();
}
function updateCount(){
  let n=0; QUESTIONS.forEach((_,i)=>{ if(document.querySelector(`input[name="q${i}"]:checked`)) n++; });
  document.getElementById("doneCount").textContent = n;
}
function goPage(p){
  document.getElementById("page1").classList.toggle("hidden", p!==1);
  document.getElementById("page2").classList.toggle("hidden", p!==2);
  document.getElementById("nav1").classList.toggle("hidden", p!==1);
  document.getElementById("nav2").classList.toggle("hidden", p!==2);
  document.getElementById("pagetag").textContent = p===1 ? "Trang 1 / 2 · Câu 1–20" : "Trang 2 / 2 · Câu 21–40";
  window.scrollTo({top:0,behavior:"smooth"});
}
function submitQuiz(){
  if(submitted) return; submitted=true;
  let correct=0, unanswered=0;
  QUESTIONS.forEach((item,i)=>{
    const chosen = document.querySelector(`input[name="q${i}"]:checked`);
    document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(l=>{ l.classList.add("locked"); l.querySelector("input").disabled=true; });
    const cLabel = document.querySelector(`.opt[data-q="${i}"][data-opt="${item.correct}"]`);
    cLabel.classList.add("correct");
    cLabel.insertAdjacentHTML("beforeend",'<span class="tag ok">\u2713 Đáp án đúng</span>');
    const dot = document.getElementById("dot"+i); dot.classList.remove("answered");
    if(!chosen){ unanswered++; dot.classList.add("res-wrong"); }
    else{
      const pick=parseInt(chosen.value,10);
      if(pick===item.correct){ correct++; dot.classList.add("res-correct"); }
      else{
        dot.classList.add("res-wrong");
        const wLabel=document.querySelector(`.opt[data-q="${i}"][data-opt="${pick}"]`);
        wLabel.classList.add("wrong");
        wLabel.insertAdjacentHTML("beforeend",'<span class="tag no">\u2715 Bạn chọn sai</span>');
      }
    }
  });
  const total=QUESTIONS.length;
  const pct=Math.floor(correct/total*1000+0.5)/10;
  const d10=Math.floor(correct/total*100+0.5)/10;
  document.getElementById("scoreCount").textContent=correct;
  document.getElementById("scorePct").textContent=pct+"%";
  document.getElementById("score10").textContent=d10.toFixed(1);
  const warn=document.getElementById("warnUnanswered");
  if(unanswered>0){ warn.textContent="\u26A0 Có "+unanswered+" câu chưa trả lời (tính là sai)."; warn.classList.remove("hidden"); }
  else warn.classList.add("hidden");
  document.getElementById("legend").classList.add("show");
  document.getElementById("page1").classList.remove("hidden");
  document.getElementById("page2").classList.remove("hidden");
  document.getElementById("pagetag").textContent="Xem lại toàn bộ 40 câu";
  document.getElementById("nav1").classList.add("hidden");
  document.getElementById("nav2").classList.add("hidden");
  document.getElementById("navResult").classList.remove("hidden");
  document.getElementById("result").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}
function retryQuiz(){
  submitted=false; render();
  document.getElementById("result").classList.add("hidden");
  document.getElementById("legend").classList.remove("show");
  document.getElementById("navResult").classList.add("hidden");
  goPage(1);
}
render();
</script>
</body>
</html>
