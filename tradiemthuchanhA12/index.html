 if(!s){out.innerHTML='<div class="msg">Không tìm thấy MSSV <b>'+esc(m)+'</b>, hoặc điểm của bạn chưa được công bố. Em kiểm tra lại MSSV hoặc liên hệ giảng viên.</div>';return}
 var h='<div style="display:flex;flex-direction:column;gap:16px"><div class="who"><div><h2>'+esc(s.name)+'</h2><p>MSSV '+esc(m)+'</p></div><div class="final"><b>'+f2(s.fin)+'</b><span> / 10</span>'+(s.fin!==s.raw?'<small>Điểm thực tế '+f2(s.raw)+', áp sàn 5,0</small>':'')+'</div></div>';
 h+='<div class="tiles">';
 var tot={E:s.se,W:s.sw,P:s.sp};
 G.forEach(function(g){h+='<div class="tile" style="--c:'+g[2]+'"><small>'+g[1]+'</small><b>'+f2(tot[g[0]])+'</b><span> / '+f2(g[3])+'</span></div>'});
 h+='</div>';
 G.forEach(function(g){
  h+='<section class="sec" style="--c:'+g[2]+'"><h3><span>'+g[1]+'</span><em>'+f2(tot[g[0]])+' / '+f2(g[3])+'</em></h3>';
  s[g[0]].forEach(function(it){var lost=it.s<it.m;
   h+='<div class="it'+(lost?' lost':'')+'"><span class="cd">'+it.c+'</span><span class="nm">'+esc(it.n)+'</span><span class="sc">'+f2(it.s)+' / '+f2(it.m)+'</span><span class="fb">'+(lost?'':'✓ ')+esc(it.f)+'</span></div>'});
  h+='</section>'});
 h+='<div class="sum"><span>Excel '+f2(s.se)+' + Word '+f2(s.sw)+' + PowerPoint '+f2(s.sp)+' = '+f2(s.raw)+'</span><b>Điểm cuối: '+f2(s.fin)+' / 10</b></div></div>';
 out.innerHTML=h;
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();show(document.getElementById("mssv").value)});
show("");
</script>
</body>
